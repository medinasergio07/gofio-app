<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="400" viewBox="0 0 1130 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
<rect width="100%" height="100%" fill="#fafafa"/>
<text x="40" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#2b2b2b">Gofio — navigation flow (MVP)</text>
<rect x="470" y="232" width="480" height="92" rx="14" fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="40" y="80" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="135.0" y="114" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">1. Sign up / Log in</text>
<rect x="340" y="80" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="435.0" y="114" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">2. Profile</text>
<rect x="640" y="80" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="735.0" y="114" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">3. Plan</text>
<rect x="490" y="250" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="585.0" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">4. Log</text>
<rect x="740" y="250" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="835.0" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">5. Progress</text>
<rect x="900" y="80" width="190" height="56" rx="12" fill="#fff" stroke="#b07a3a" stroke-width="2"/>
<text x="995.0" y="114" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#2b2b2b" text-anchor="middle">6. Why this?</text>
<line x1="232" y1="108" x2="338" y2="108" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="285" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">new user</text>
<line x1="532" y1="108" x2="638" y2="108" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="585" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">generate plan</text>
<path d="M135 138 L135 190 L705 190 L705 140" fill="none" stroke="#2b2b2b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="420" y="182" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">returning user (saved profile + cached plan)</text>
<line x1="682" y1="138" x2="600" y2="248" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="682" y1="278" x2="738" y2="278" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="832" y1="108" x2="898" y2="108" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a)"/>
<text x="865" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">tap</text>
<text x="710" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">bottom tab bar: Plan · Log · Progress · Profile (any screen to any screen)</text>
<text x="40" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8a8a">Profile is also in the tab bar: saving it recalculates the calorie target and offers to regenerate the plan.</text>
